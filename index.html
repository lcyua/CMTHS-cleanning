<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>청소구역 배정</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    h1, h2 { text-align: center; }
    table, th, td {
      border: 1px solid #aaa;
      border-collapse: collapse;
      padding: 8px;
      text-align: center;
      width: 100%;
    }
    .highlight {
      background-color: #f0f0f0;
      padding: 10px;
      margin-bottom: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>청소구역 배정 시스템</h1>
  <div id="dateInfo"></div>
  <div id="cleaningTable"></div>

  <div id="adminLogin" style="text-align: center; margin-top: 30px;">
    <button onclick="loginAdmin()">🔐 관리자 로그인</button>
    <div id="adminMessage"></div>
  </div>

  <script>
    const defaultZones = [
      "취업지원부 줄 빗자루, 대걸래, 분리수거 가져가기",
      "가운데 줄 빗자루, 대걸래, 분리수거 가져가기",
      "진로상담교육부 줄 빗자루, 대걸래, 환기",
      "화분 밑 손걸래, 취업지원부 세절기",
      "싱크대 커피머신 서랍장 손걸래, 진로상담교육부 세절기",
      "교사쓰레기통, 전체 쓰레기통 정리"
    ];

    const defaultStudents = [
      "박찬진", "이동현", "정지훈", "정한영", "하현일", "허윤재"
    ];

    const daysKor = ["일", "월", "화", "수", "목", "금", "토"];
    const cleaningDays = [1, 3, 5]; // 월, 수, 금

    function hashCode(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash);
    }

    function getSeedFromDate(dateString) {
      const baseDateStr = new Date(dateString).toISOString().split('T')[0];
      const hash = hashCode(baseDateStr).toString();
      return parseInt(hash[5]); // 앞에서 6번째 숫자 사용
    }

    // 안정적인 난수 생성기
    function mulberry32(seed) {
      return function () {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // 시드 기반 셔플
    function shuffle(seed) {
      const array = [1, 2, 3, 4, 5, 6];
      const rand = mulberry32(seed);
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function getNextCleaningDate(date) {
      const next = new Date(date);
      do {
        next.setDate(next.getDate() + 1);
      } while (!cleaningDays.includes(next.getDay()));
      return next;
    }

    function renderTable(date, isTodayCleaning) {
      const dateStr = date.toISOString().split('T')[0];
      const seed = getSeedFromDate(dateStr);
      const order = shuffle(seed);
      let html = `<h2>${isTodayCleaning ? "오늘" : "다음 청소일"} (${dateStr}) 청소구역 배정표</h2>`;
      html += `<table><tr><th>이름</th><th>청소구역</th></tr>`;
      for (let i = 0; i < 6; i++) {
        html += `<tr><td>${defaultStudents[order[i] - 1]}</td><td>${defaultZones[i]}</td></tr>`;
      }
      html += `</table>`;
      return html;
    }

    function render() {
      const now = new Date();
      const todayStr = now.toISOString().split('T')[0];
      const day = now.getDay();
      const dateInfo = document.getElementById("dateInfo");
      const tableDiv = document.getElementById("cleaningTable");

      dateInfo.innerHTML = `<div class="highlight"><strong>오늘 날짜:</strong> ${todayStr} (${daysKor[day]})</div>`;

      if (cleaningDays.includes(day)) {
        tableDiv.innerHTML = renderTable(now, true);
      } else {
        const nextDate = getNextCleaningDate(now);
        tableDiv.innerHTML = `<p style="text-align:center;">오늘은 봉사요일이 아닙니다.</p>
                              <p style="text-align:center;"><strong>다음 청소일:</strong> ${nextDate.toISOString().split('T')[0]}</p>
                              ${renderTable(nextDate, false)}`;
      }
    }

    function loginAdmin() {
      const pw = prompt("관리자 비밀번호를 입력하세요:");
      if (pw === "1214") {
        const msg = `
        <p>✅ 관리자 인증 성공</p>
        <p><a href="https://github.com/amuse0636/CMTHS_cleaning" target="_blank">🔗 깃허브에서 수정하러 가기</a></p>`;
        document.getElementById("adminMessage").innerHTML = msg;
      } else {
        alert("❌ 잘못된 비밀번호입니다.");
      }
    }

    render();
  </script>
</body>
</html>
